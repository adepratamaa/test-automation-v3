name: Playwright Tests

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          : "${BASE_URL:?Missing BASE_URL secret}"
          : "${VALID_USERNAME:?Missing VALID_USERNAME secret}"
          : "${VALID_PASSWORD:?Missing VALID_PASSWORD secret}"

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Playwright Docker image
        run: docker build --tag test-automation-v3:${{ env.SHORT_SHA }} .

      - name: Run Playwright tests in Docker
        run: |
          docker run --rm \
            --init \
            --ipc=host \
            --env BASE_URL \
            --env VALID_USERNAME \
            --env VALID_PASSWORD \
            --volume "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            test-automation-v3:${{ env.SHORT_SHA }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ env.SHORT_SHA }}
          path: playwright-report/
          retention-days: 30
