name: Playwright Tests

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Playwright Docker image
        run: docker build --tag test-automation-v3 .

      - name: Run Playwright tests in Docker
        run: |
          docker run --rm \
            --env BASE_URL \
            --env VALID_USERNAME \
            --env VALID_PASSWORD \
            --volume "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            --volume "${{ github.workspace }}/test-results:/app/test-results" \
            test-automation-v3

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
